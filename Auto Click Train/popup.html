<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>AutoClicker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top bar */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-title {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 1.5px solid #333;
      transition: all 0.3s;
    }
    .dot.armed  { background: #f59e0b; border-color: #f59e0b; box-shadow: 0 0 6px #f59e0b88; animation: blink 1.2s infinite; }
    .dot.done   { background: #22c55e; border-color: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.error  { background: #ef4444; border-color: #ef4444; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* Fields */
    .field { display: flex; flex-direction: column; gap: 4px; }
    label {
      font-size: 10px;
      color: #444;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    input, select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      background: #161616;
      border: 1px solid #222;
      color: #e0e0e0;
      padding: 8px 10px;
      border-radius: 4px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #555; }
    select option { background: #161616; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* Time input special */
    #clickTime {
      font-size: 18px;
      letter-spacing: 2px;
      text-align: center;
      color: #fff;
    }

    /* Test row */
    .test-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .test-row label { color: #333; white-space: nowrap; margin: 0; }
    .test-row input { width: 52px; text-align: center; font-size: 12px; padding: 6px 6px; }
    .test-row button {
      flex: 1;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      background: #1a1a1a;
      color: #888;
      border: 1px solid #2a2a2a;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .test-row button:hover { color: #ccc; border-color: #444; }

    /* Divider */
    hr { border: none; border-top: 1px solid #1c1c1c; }

    /* Status */
    .status {
      font-size: 11px;
      color: #444;
      letter-spacing: 0.3px;
      min-height: 16px;
      transition: color 0.2s;
    }
    .status.active { color: #f59e0b; }
    .status.done   { color: #22c55e; }

    /* Countdown */
    .countdown {
      display: none;
      font-size: 26px;
      font-weight: 600;
      color: #f59e0b;
      letter-spacing: 3px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Buttons */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 9px 4px;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: all 0.12s;
    }
    .btn-save {
      background: #16a34a22;
      color: #4ade80;
      border-color: #16a34a44;
    }
    .btn-save:hover { background: #16a34a33; border-color: #16a34a88; }

    .btn-arm {
      background: #1d4ed822;
      color: #60a5fa;
      border-color: #1d4ed844;
    }
    .btn-arm:hover { background: #1d4ed833; border-color: #1d4ed888; }

    .btn-stop {
      background: #1a1a1a;
      color: #555;
      border-color: #222;
    }
    .btn-stop:hover:not(:disabled) { color: #ef4444; border-color: #ef444455; }
    .btn:disabled { opacity: .3; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="top">
    <span class="top-title">AutoClicker</span>
    <div class="dot" id="dot"></div>
  </div>

  <div class="row-2">
    <div class="field">
      <label>Train No.</label>
      <input id="trainFilter" type="text" placeholder="22177"/>
    </div>
    <div class="field">
      <label>Class</label>
      <select id="classSelect">
        <option value="SL">SL</option>
        <option value="3A" selected>3A</option>
        <option value="2A">2A</option>
        <option value="1A">1A</option>
        <option value="CC">CC</option>
        <option value="EC">EC</option>
        <option value="2S">2S</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Fire Time</label>
    <input id="clickTime" type="time" step="1" value="08:00:00"/>
  </div>

  <div class="test-row">
    <label>test in</label>
    <input id="testSeconds" type="number" value="10" min="3" max="300"/>
    <label>sec</label>
    <button id="testInBtn">→ set</button>
  </div>

  <hr/>

  <div class="status" id="statusText">ready</div>
  <div class="countdown" id="countdown">00:00:00</div>

  <div class="btn-row">
    <button class="btn btn-save" id="saveBtn">save</button>
    <button class="btn btn-arm"  id="armBtn">arm</button>
    <button class="btn btn-stop" id="stopBtn" disabled>stop</button>
  </div>

<script src="popup.js"></script>
</body>
</html>
